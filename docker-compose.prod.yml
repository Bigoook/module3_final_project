# Production stack: PostgreSQL + gunicorn behind a TLS-terminating proxy.
#
#   copy .env.prod.example .env.prod   # fill in real values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The shared Dockerfile keeps its development CMD (runserver with autoreload);
# gunicorn is started here so local development is unaffected.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes interpolation, so the values are read from the container's own
      # env (.env.prod) at run time. A bare ${POSTGRES_USER} would be expanded by
      # Compose from the host .env instead and could check the wrong user/db.
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    # Workers/timeouts come from gunicorn.conf.py, which reads the env above.
    command: gunicorn config.wsgi:application --config gunicorn.conf.py
    # Published on the loopback only: put nginx/Caddy/Traefik in front of it.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  media:
