[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
testpaths = ["apps"]
addopts = "-ra --ignore=local_docs"


[tool.ruff]
target-version = "py312"
line-length = 120

extend-exclude = [
    "**/migrations/**",
    "local_docs",
    "**/static/**",
]


[tool.ruff.lint]
preview = true

select = [
    "BLE",  # flake8-blind-except
    "C",  # flake8-comprehensions
    "COM",  # flake8-commas
    "E",  # pycodestyle Error
    "EM",  # flake8-errmsg
    "EXE",  # flake8-executable
    "F",  # Pyflakes
    "FA",  # flake8-future-annotations
    "FLY",  # flynt
    "G",  # flake8-logging-format
    "I",  # isort
    "ICN",  # flake8-import-conventions
    "INT",  # flake8-gettext
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PLC",  # Pylint Convention
    "PLE",  # Pylint Error
    "PLW",  # Pylint Warning
    "PYI",  # flake8-pyi
    "RET",  # flake8-return
    "RUF",  # Ruff-specific rules
    "S",  # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "SLOT",  # flake8-slots
    "T",  # flake8-print
    "TC",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",  # pyupgrade
    "W",  # pycodestyle Warning
    "YTT",  # flake8-2020
]

ignore = [
    # ---- Pragmatic ignores (community compatibility) ----
    "unnecessary-collection-call",  # unnecessary-collection-call
    "unnecessary-dict-comprehension-for-iterable",  # unnecessary-dict-comprehension-for-iterable
    "complex-structure",  # complex-structure (views/forms are complex by nature)
    "multiple-leading-hashes-for-block-comment",  # multiple-leading-hashes-for-block-comment
    "blank-lines-top-level",  # expected 2 blank lines (import * / settings files)
    "line-too-long",  # line-too-long (handled via line-length above)
    "not-in-test",  # not-in-test
    "f-string-in-exception",  # f-string-in-exception
    "future-rewritable-type-annotation",  # future-rewritable-type-annotation
    "blanket-type-ignore",  # blanket-type-ignore
    "unnecessary-placeholder",  # unnecessary-placeholder
    "unnecessary-range-start",  # unnecessary-range-start
    "import-private-name",  # import-private-name
    "redefined-loop-name",  # redefined-loop-name
    "ambiguous-unicode-character-string",  # ambiguous-unicode-character-string (Ukrainian/i18n text)
    "collection-literal-concatenation",  # collection-literal-concatenation
    "unused-noqa",  # unused-noqa
    "collapsible-if",  # collapsible-if (nested template/view conditions are fine)
    "if-else-block-instead-of-if-exp",  # if-else-block-instead-of-if-exp
    "multiple-with-statements",  # multiple-with-statements
    "raise-vanilla-args",  # raise-vanilla-args
    "try-consider-else",  # try-consider-else
    "raise-within-try",  # raise-within-try
    "error-instead-of-exception",  # error-instead-of-exception
    "printf-string-formatting",  # printf-string-formatting

    # ---- Formatter-friendly (deferred to ruff format) ----
    "missing-trailing-comma",  # trailing-comma-missing
    "single-line-implicit-string-concatenation",  # single-line implicit string concat

    # ---- Django development patterns ----
    "raw-string-in-exception",  # plain string in raise — forms raise ValidationError('msg')
    "logging-exc-info",  # logging.exception inside except — common pattern
    "assert",  # assert — fine in tests and some validators
    "private-member-access",  # private member access — Django uses _meta, _default_manager
    "relative-imports",  # relative-imports — Django apps sometimes use package-relative

    # ---- Typing: keep loose at this stage ----
    "non-pep585-annotation",  # use-pep585-annotation (list vs List)
    "non-pep604-annotation-union",  # use-pep604-annotation (X | Y vs Optional[X])
    "deprecated-import",  # deprecated-import (typing module)
]


[tool.ruff.lint.per-file-ignores]
"manage.py" = [
    "import-outside-top-level",  # Django scaffold: `import` inside try/except ImportError
]
"config/settings/*.py" = [
    "undefined-local-with-import-star",  # star-import (base settings via `from .base import *`)
    "undefined-local-with-import-star-usage",  # undefined-name-from-star (names from star-import)
]
"**/__init__.py" = [
    "unused-import",  # re-exports
    "unsorted-imports",  # import-sorting (re-export order is intentional)
]
# Tests: everything that makes test writing painful
"**/tests/**/*.py" = [
    "assert",  # assert
    "hardcoded-password-string",  # hardcoded password in test fixtures
    "hardcoded-password-func-arg",  # hardcoded password argument
    "try-except-pass",  # try/except/pass
    "print",  # print statements (debugging)
    "magic-value-comparison",  # magic values in comparisons (assertEqual(result, 42))
    "unused-variable",  # unused variable (common in test setup)
    "blind-except",  # blind-except
    "raw-string-in-exception",  # plain string in exception
    "import-outside-top-level",  # conditional imports in test helpers
    "suppressible-exception",  # suppressible-exception (contextlib.suppress vs try/except/pass)
]
"**/tests.py" = [
    "assert",  # assert
    "hardcoded-password-string",  # hardcoded password in test fixtures
    "hardcoded-password-func-arg",  # hardcoded password argument
    "try-except-pass",  # try/except/pass
    "print",  # print statements (debugging)
    "magic-value-comparison",  # magic values in comparisons
    "unused-variable",  # unused variable (common in test setup)
    "blind-except",  # blind-except
    "raw-string-in-exception",  # plain string in exception
    "import-outside-top-level",  # conditional imports in test helpers
    "suppressible-exception",  # suppressible-exception
]


[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
known-first-party = ["config", "apps"]


[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true


[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.12"
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "environ"
ignore_missing_imports = true


[tool.django-stubs]
django_settings_module = "config.settings.local"