services:
  db:
    image: postgres:17-alpine
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      .env.dev
    healthcheck:
      # $$ escapes interpolation so the values are read from the container's own
      # env (.env.dev) at run time; a bare ${...} would be resolved by Compose
      # from a host-side .env file that this project does not use.
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      retries: 10

  web:
    build:
      dockerfile: ./Dockerfile
    env_file: .env.dev
    environment:
      # Demo products/orders so the storefront can be checked in both languages.
      # A literal, not a ${SEED_DATA:-1} substitution: production runs with
      # SEED_DATA=0 via .env.prod, and demo data must never land in a real DB.
      SEED_DATA: "1"
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy


volumes:
  pgdata:
  media: