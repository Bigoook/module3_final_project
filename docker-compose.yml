services:
  db:
    image: postgres:17-alpine
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      .env.dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      retries: 10

  web:
    build:
      dockerfile: ./Dockerfile
    env_file: .env.dev
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy


volumes:
  pgdata:
  media: