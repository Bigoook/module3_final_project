name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        ports:
          - "5432:5432"
        volumes:
          - pgdata:/var/lib/postgresql/data
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: final3
        options: >-
          --health-cmd "pg_isready -U postgres -d final3"
          --health-interval 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/final3

    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - run: pip install -r requirements-dev.txt
        - run: ruff check .
        - run: mypy .
        - run: pytest .
